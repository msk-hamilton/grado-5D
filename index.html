<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5D Spanish: Practice on Your Own</title>
<style>
  :root{
    --ink:#1f2340; --soft:#5a5f80; --bg:#fff8ec; --card:#ffffff;
    --green:#1f9d55; --green-bg:#e3f7ea;
    --c:#3b82f6; /* topic color, set per topic */
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:"Segoe UI", "Trebuchet MS", Arial, sans-serif;
    color:var(--ink); background:var(--bg);
    display:flex; flex-direction:column; min-height:100vh;
  }
  button{font-family:inherit; cursor:pointer}

  /* ---------- HOME ---------- */
  #home{flex:1; display:flex; flex-direction:column; align-items:center; padding:2.5vh 3vw}
  .home-head{text-align:center; margin-bottom:2.5vh}
  .home-head h1{margin:0; font-size:clamp(32px,4.6vw,64px); letter-spacing:.5px}
  .home-head h1 span{color:#e4572e}
  .home-head p{margin:.4em 0 0; font-size:clamp(16px,1.7vw,24px); color:var(--soft)}
  .grid{
    width:100%; max-width:1400px; flex:1;
    display:flex; flex-wrap:wrap; justify-content:center; align-content:stretch; gap:2vh 1.6vw;
  }
  .topic-btn{
    flex:0 0 calc((100% - 3.2vw) / 3);
    border:none; border-radius:24px; padding:1.6vh 1.2vw;
    background:var(--c); color:#fff; text-align:left;
    display:flex; align-items:center; gap:1.2vw;
    box-shadow:0 6px 0 rgba(0,0,0,.18); transition:transform .1s;
  }
  .topic-btn:hover{transform:translateY(-3px)}
  .topic-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
  .topic-btn .ico{font-size:clamp(40px,5vw,76px); line-height:1; background:rgba(255,255,255,.25); border-radius:18px; padding:.15em .2em}
  .topic-btn .t{font-size:clamp(20px,2.1vw,34px); font-weight:800; line-height:1.15}
  .topic-btn .s{font-size:clamp(14px,1.25vw,20px); opacity:.95; margin-top:.25em}
  .home-foot{margin-top:2vh; font-size:15px; color:var(--soft); display:flex; gap:20px; align-items:center; flex-wrap:wrap; justify-content:center}
  .small-btn{border:2px solid #ccd; background:#fff; border-radius:12px; padding:6px 14px; font-size:15px; color:var(--ink)}

  /* ---------- ACTIVITY ---------- */
  #activity{flex:1; display:none; flex-direction:column}
  .bar{
    background:var(--c); color:#fff; display:flex; align-items:center; gap:16px;
    padding:1.2vh 2vw; font-size:clamp(18px,1.8vw,28px); font-weight:800;
  }
  .bar .bar-ico{font-size:1.4em}
  .bar .dots{margin-left:auto; display:flex; gap:8px}
  .dot{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.4)}
  .dot.on{background:#fff}
  .stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1.5vh 4vw; text-align:center; gap:1.4vh}
  .dir{
    font-size:clamp(17px,min(1.9vw,3.2vh),30px); color:var(--soft); font-weight:600;
    background:#fff; border-radius:999px; padding:.35em 1.1em; border:3px solid var(--c);
  }
  .dir b{color:var(--ink)}
  .vis{font-size:clamp(56px,min(10vw,14vh),160px); line-height:1.1; min-height:1em}
  .vis .lbl{display:block; font-size:clamp(18px,1.8vw,28px); font-weight:700; color:var(--soft)}
  .vis-row{display:flex; gap:3vw; justify-content:center; align-items:flex-end; flex-wrap:wrap}
  .vis-row > div{display:flex; flex-direction:column; align-items:center}
  .story{
    background:#fff; border-left:10px solid var(--c); border-radius:16px;
    padding:1.2vh 2vw; font-size:clamp(20px,min(2.4vw,3.6vh),38px); line-height:1.35; text-align:left;
    box-shadow:0 3px 10px rgba(0,0,0,.07)
  }
  .q{font-size:clamp(30px,min(5vw,7.5vh),78px); font-weight:800; line-height:1.15; margin:0}
  .blank{display:inline-block; min-width:2.6em; border-bottom:6px solid var(--c)}
  .choices{display:flex; gap:2vw; flex-wrap:wrap; justify-content:center}
  .choice{
    background:#fff; border:4px solid var(--c); border-radius:20px;
    font-size:clamp(22px,min(3vw,5vh),48px); font-weight:700; padding:.2em .9em;
    display:flex; align-items:center; gap:.45em; transition:all .25s;
  }
  .choice .letter{
    background:var(--c); color:#fff; border-radius:50%;
    width:1.5em; height:1.5em; display:inline-flex; align-items:center; justify-content:center; font-size:.75em
  }
  .choice.right{border-color:var(--green); background:var(--green-bg)}
  .choice.right .letter{background:var(--green)}
  .choice.dim{opacity:.35}
  .answer{
    display:none; background:var(--green-bg); border:4px solid var(--green); border-radius:22px;
    padding:.8vh 3vw; animation:pop .3s ease-out;
  }
  .answer.show{display:block}
  .answer .es{font-size:clamp(28px,min(4.4vw,6.5vh),70px); font-weight:800; color:#126b3a}
  .answer .en{font-size:clamp(16px,min(1.8vw,3vh),28px); color:var(--soft); margin-top:.2em}
  @keyframes pop{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}

  /* intro + end */
  .goal{font-size:clamp(20px,2vw,32px); color:var(--soft); font-weight:600}
  .bank{display:flex; gap:1.6vw; flex-wrap:wrap; justify-content:center; max-width:1300px}
  .word{
    background:#fff; border-radius:20px; padding:1.2vh 1.4vw; min-width:11vw;
    border-bottom:8px solid var(--c); box-shadow:0 3px 10px rgba(0,0,0,.07)
  }
  .word .e{font-size:clamp(46px,5vw,84px); line-height:1.1}
  .word .w{font-size:clamp(22px,2.3vw,38px); font-weight:800}
  .word .m{font-size:clamp(14px,1.3vw,20px); color:var(--soft)}
  .vis.hero{font-size:clamp(90px,min(14vw,24vh),240px)}
  .goal-big{font-size:clamp(30px,min(4.2vw,7vh),68px); font-weight:800; max-width:1200px; line-height:1.25}
  .bank.big{align-items:flex-end}
  .bank.big .word{min-width:15vw; padding:2vh 1.8vw}
  .bank.big .e{font-size:clamp(60px,min(7vw,13vh),120px)}
  .bank.big .w{font-size:clamp(26px,min(3vw,5vh),50px)}
  .bank.big .m{font-size:clamp(16px,min(1.6vw,2.8vh),26px)}
  .story-wrap{display:flex; gap:3vw; align-items:center; justify-content:center; width:100%; max-width:1500px}
  .pic{width:min(46vw,62vh); aspect-ratio:4/3; object-fit:contain; border-radius:20px; background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .pic.ph{border:5px dashed var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.4em; padding:2vh 2vw; text-align:center; font-size:clamp(18px,min(1.9vw,3.2vh),30px); color:var(--soft); box-shadow:none}
  .ph-ico{font-size:2.6em}
  .ph-note{font-size:.75em}
  .pic-sm{height:min(22vh,220px); border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .story.big{font-size:clamp(24px,min(2.8vw,4.6vh),46px); padding:2vh 2.4vw}
  .story-title{font-weight:900; color:var(--c); margin-bottom:.3em}
  .snd-title{margin:0; font-size:clamp(34px,min(4.6vw,7.5vh),74px); font-weight:900; color:var(--c)}
  .syl{display:flex; gap:1.2vw; flex-wrap:wrap; justify-content:center}
  .syl span{background:var(--c); color:#fff; border-radius:14px; padding:.15em .6em; font-size:clamp(24px,min(2.8vw,4.6vh),46px); font-weight:800}
  .sb{font-size:clamp(20px,min(2.2vw,3.8vh),36px); color:var(--soft); margin-top:.2em}
  .sb .stress{color:var(--c); font-weight:900; font-size:1.15em}
  .sb .dash{margin:0 .2em; opacity:.6}
  .bank.snd .word{padding:2.4vh 2.6vw; min-width:18vw}
  .bank.snd .w{font-size:clamp(34px,min(4.4vw,7.5vh),72px)}
  .bank.snd .sb{font-size:clamp(24px,min(2.8vw,4.8vh),46px)}
  .tip{font-size:clamp(17px,min(1.8vw,3vh),28px); color:var(--soft)}
  .talk{display:flex; flex-direction:column; gap:1.1vh; width:min(1000px,80vw)}
  .bub{font-size:clamp(26px,min(3vw,5vh),50px); font-weight:700; background:#fff; border-radius:24px; padding:.35em .9em; max-width:80%; box-shadow:0 3px 10px rgba(0,0,0,.08); text-align:left}
  .bub.luna{align-self:flex-start; border-left:10px solid #d63384}
  .bub.leo{align-self:flex-end; border-right:10px solid #0077b6}
  .bub .ten{display:block; font-size:.48em; color:var(--soft); font-weight:500; margin-top:.1em}
  .bub .who{display:block; font-size:.5em; color:var(--soft); font-weight:700}
  .story .sl{margin-bottom:.35em}
  .story .sen{display:block; font-size:.62em; color:var(--soft); line-height:1.25}
  .story.big{font-size:clamp(20px,min(2.1vw,3.7vh),36px); flex:0 1 52vw}
  .story-wrap .pic{flex:0 0 auto; width:min(38vw,56vh)}
  .model{font-size:clamp(24px,min(2.8vw,4.6vh),46px); font-weight:800; background:#fff; border-radius:16px; padding:.2em .8em; border:3px dashed var(--c)}
  .cal{display:inline-flex; flex-direction:column; align-items:center; background:#fff; border:4px solid var(--c); border-radius:14px; overflow:hidden; width:2.2em; line-height:1; vertical-align:bottom; position:relative; margin:0 .08em}
  .cal-m{background:var(--c); color:#fff; width:100%; text-align:center; font-size:.24em; font-weight:800; padding:.25em 0}
  .cal-d{font-size:.8em; font-weight:900; color:var(--ink); padding:.08em 0 0}
  .cal-w{font-size:.2em; font-weight:700; color:var(--soft); padding:.1em 0 .35em}
  .cal-t{position:absolute; top:.32em; right:-.05em; transform:rotate(12deg); background:#e4572e; color:#fff; font-size:.16em; font-weight:900; padding:.15em .4em; border-radius:6px}
  .sign{display:inline-block; color:#fff; font-weight:900; letter-spacing:.06em; border-radius:12px; padding:.15em .45em; font-size:.42em; border:4px solid rgba(0,0,0,.2); vertical-align:middle}
  .bank.signs .e{font-size:clamp(70px,min(8vw,13vh),130px)}
  .tbl{position:relative; display:inline-block; vertical-align:bottom}
  .tbl-top{position:absolute; left:8%; right:8%; top:38%; height:8%; background:#8a5a2b; border-radius:4px}
  .tbl-leg{position:absolute; top:44%; bottom:2%; width:6%; background:#8a5a2b; border-radius:3px}
  .tbl-leg.l{left:14%} .tbl-leg.r{right:14%}
  .tbl-item{position:absolute; font-size:.55em; line-height:1}
  .bank.months{max-width:1250px; gap:1.6vh 1.2vw}
  .bank.months .word{flex:0 0 calc((100% - 3.6vw) / 4); min-width:0; padding:1vh 1vw; display:flex; align-items:center; gap:.6vw; border-bottom-width:5px}
  .bank.months .e{font-size:clamp(18px,min(1.8vw,3vh),30px); font-weight:900; color:#fff; background:var(--c); border-radius:50%; width:1.7em; height:1.7em; display:flex; align-items:center; justify-content:center; flex-shrink:0}
  .bank.months .w{font-size:clamp(22px,min(2.5vw,4.4vh),40px)}
  .bank.months .m{display:none}
  .vimg{height:1.15em; width:auto; max-width:1.8em; object-fit:contain; vertical-align:bottom; border-radius:.12em}
  .big-title{font-size:clamp(44px,6vw,96px); font-weight:900; margin:0; color:var(--c)}

  /* controls */
  .controls{display:flex; justify-content:center; gap:1.4vw; padding:1vh 2vw 1.8vh; flex-wrap:wrap}
  .ctl{
    border:none; border-radius:18px; font-size:clamp(20px,2vw,32px); font-weight:800;
    padding:.45em 1.1em; color:#fff; box-shadow:0 5px 0 rgba(0,0,0,.2)
  }
  .ctl:active{transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.2)}
  .ctl:disabled{opacity:.35; cursor:default}
  .ctl.home{background:#6b7280}
  .ctl.back{background:#8b5cf6}
  .ctl.show{background:var(--green); min-width:14vw}
  .ctl.next{background:#e4572e}

  /* ball and box scene */
  .scene{position:relative; width:min(560px,60vw); height:min(300px,32vw,27vh)}
  .scene .ground{position:absolute; left:0; right:0; bottom:8%; height:10px; background:#9ad17a; border-radius:6px}
  .scene .box{
    position:absolute; left:50%; transform:translateX(-50%); bottom:calc(8% + 6px);
    width:34%; height:52%; background:#c8874a; border:6px solid #8a5a2b; border-radius:10px; z-index:2
  }
  .scene .box::after{content:""; position:absolute; left:42%; width:16%; top:0; bottom:0; background:#e2b27a}
  .scene .ball{
    position:absolute; width:17%; aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #ffd1dc 0 12%, #ff3b6b 13% 100%);
    border:5px solid #b3123f;
  }
  .scene .ball.left{left:4%; bottom:calc(8% + 6px); z-index:3}
  .scene .ball.right{right:4%; bottom:calc(8% + 6px); z-index:3}
  .scene .ball.front{left:50%; transform:translateX(-50%); bottom:2%; z-index:3}
  .scene .ball.behind{left:50%; transform:translateX(-50%); bottom:50%; z-index:1}
  .side-tags{display:flex; justify-content:space-between; width:min(560px,60vw); font-size:clamp(14px,1.3vw,20px); color:var(--soft); font-weight:700}

  @media (max-width:800px){ .topic-btn{flex-basis:calc((100% - 1.6vw) / 2)} }
  /* ---------- student additions ---------- */
  .story .sl{margin-bottom:.35em}
  .story .sen{display:block; font-size:.6em; color:var(--soft); line-height:1.25; padding-left:2.2em}
  .qen{font-size:clamp(16px,1.7vw,24px); color:var(--soft); font-weight:500; margin-top:-.6vh}
  .qen.inline{display:inline; font-size:.9em}
  .goal-card .qen{margin-top:.3em; font-size:.8em}
  .board{width:100%; max-width:960px; background:#fff; border-radius:20px; padding:12px; box-shadow:0 3px 10px rgba(0,0,0,.08)}
  .tools{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; margin-bottom:10px}
  .sw{width:46px; height:46px; border-radius:50%; border:4px solid #fff; box-shadow:0 0 0 2px #ccd; cursor:pointer}
  .sw.on{box-shadow:0 0 0 4px var(--ink); transform:scale(1.12)}
  .tool{font-family:inherit; font-size:18px; font-weight:700; background:#f1f2f8; border:3px solid #d7d9e8; border-radius:14px; padding:6px 12px; cursor:pointer; color:var(--ink)}
  .tool.on{border-color:var(--c); background:#fff7d6}
  #cv{width:100%; aspect-ratio:5/3; border:3px solid #e3e5f0; border-radius:12px; touch-action:none; display:block; background:#fff}
  .write{width:100%; max-width:960px; display:flex; flex-direction:column; gap:10px; text-align:left; font-size:clamp(18px,1.8vw,26px)}
  .write input{font-family:inherit; font-size:clamp(22px,2.4vw,36px); padding:.3em .6em; border:4px solid var(--c); border-radius:16px; width:100%}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{font-family:inherit; font-size:clamp(17px,1.7vw,24px); font-weight:700; border:none; background:var(--c); color:#fff; border-radius:999px; padding:.25em .8em; cursor:pointer}

  html{scroll-behavior:smooth}
  #activity{min-height:100vh}
  .bar{position:sticky; top:0; z-index:5}
  .progress{height:10px; background:rgba(0,0,0,.08)} .progress div{height:100%; background:var(--c); transition:width .3s}
  .stage{justify-content:flex-start; padding-top:3vh}
  .topic-btn{position:relative}
  .check{position:absolute; top:10px; right:14px; background:#fff; color:#1f9d55; border-radius:50%; width:40px; height:40px; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900}
  .goal-card{font-size:clamp(20px,2.2vw,32px); background:#fff; border-radius:20px; padding:.6em 1.2em; border:3px solid var(--c); font-weight:700; max-width:900px}
  button.word{border:none; font-family:inherit; color:var(--ink); cursor:pointer}
  button.word:hover{transform:translateY(-3px)}
  .spk{border:none; background:var(--c); color:#fff; border-radius:12px; font-size:.6em; padding:.15em .35em; vertical-align:middle; cursor:pointer}
  .spk.sm{font-size:clamp(18px,1.9vw,28px)}
  .spk.read-all{font-size:clamp(14px,1.3vw,20px); padding:.3em .7em; margin-left:.6em}
  button.choice{cursor:pointer; font-family:inherit; color:var(--ink)}
  button.choice:hover:not(:disabled){transform:translateY(-2px)}
  .choice.wrong{border-color:#ef4444; background:#fde8e8; opacity:.6; animation:shake .35s}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fb{min-height:2em; border-radius:20px; padding:.6em 1.4em; display:none}
  .fb.good{display:block; background:var(--green-bg); border:4px solid var(--green); animation:pop .3s}
  .fb.try{display:block; background:#fff4e5; border:4px solid #f59e0b}
  .fb-head{font-size:clamp(24px,2.6vw,40px); font-weight:900}
  .fb.good .fb-head{color:#126b3a} .fb.try .fb-head{color:#b45309}
  .fb .es{font-size:clamp(22px,2.4vw,36px); font-weight:700}
  .fb .en{font-size:clamp(16px,1.6vw,24px); color:var(--soft)}
  .match{display:flex; gap:4vw; justify-content:center; width:100%; max-width:1000px}
  .mcol{display:flex; flex-direction:column; gap:1.4vh; flex:1}
  .mcard{background:#fff; border:4px solid #d7d9e8; border-radius:18px; padding:.3em .6em; font-family:inherit; color:var(--ink); cursor:pointer; min-height:0; display:flex; align-items:center; justify-content:center; transition:all .2s}
  .mcard.pic-side{font-size:clamp(38px,min(5vw,8.5vh),68px); line-height:1.15; padding:.1em .4em}
  .mcard.word-side{min-height:calc(clamp(34px,min(4.4vw,7.5vh),60px) * 1.15 + .2em)}
  .mcard.word-side{font-size:clamp(22px,2.6vw,40px); font-weight:800}
  .mcard.sel{border-color:var(--c); background:#fff7d6; transform:scale(1.04)}
  .mcard.ok{border-color:var(--green); background:var(--green-bg); opacity:.75; cursor:default}
  .mcard.no{border-color:#ef4444; background:#fde8e8; animation:shake .35s}
  .line{min-height:2.4em; width:100%; max-width:1100px; background:#fff; border:4px dashed var(--c); border-radius:20px; padding:.4em; display:flex; flex-wrap:wrap; gap:.5em; justify-content:center; align-items:center; font-size:clamp(22px,2.6vw,40px)}
  .line.good{border:4px solid var(--green); background:var(--green-bg)}
  .ph-line{color:var(--soft); font-size:.6em}
  .tiles{display:flex; flex-wrap:wrap; gap:.6em; justify-content:center; font-size:clamp(22px,2.6vw,40px); min-height:1.6em}
  .tile{font-family:inherit; font-size:1em; font-weight:800; background:var(--c); color:#fff; border:none; border-radius:14px; padding:.25em .7em; cursor:pointer; box-shadow:0 4px 0 rgba(0,0,0,.2)}
  .tile.in{background:#fff; color:var(--ink); border:3px solid var(--c); box-shadow:none}
  .row-btns{display:flex; gap:1.4vw; align-items:center}
  .ctl.pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .bub.solo{align-self:center; max-width:900px; border-right:none}
  @media (max-width:700px){
    .grid{grid-template-columns:1fr}
    .story-wrap{flex-direction:column}
    .pic{width:90vw}
    .match{gap:3vw}
    .controls{position:sticky; bottom:0; background:var(--bg)}
  }
</style>
</head>
<body>
<section id="home">
  <div class="home-head">
    <h1>¡Hola, <span>5D</span>! Practica español</h1>
  </div>
  <div class="grid" id="grid"></div>
</section>
<section id="activity">
  <div class="bar"><span class="bar-ico" id="barIco"></span><span id="barTitle"></span></div>
  <div class="progress"><div id="prog"></div></div>
  <div class="stage" id="stage"></div>
  <div class="controls">
    <button class="ctl home" onclick="goHome()">🏠 Home</button>
    <button class="ctl back" id="backBtn" onclick="back()">◀ Back</button>
    <button class="ctl next" id="nextBtn" onclick="next()">Next ▶</button>
  </div>
</section>
<script>
/* ---------- story pictures ----------
   Paste an image (data: URI or file name) for each story. Empty = placeholder box. */
const PICS = {
  meses:"", tablero:"", calendario:"", mochila:"", ventana:"", libros:"", etiquetas:"", guia:""
};
const PIC_NAMES = {
  meses:"Ana and Leo look at a July calendar; summer in Madrid, winter in Santiago",
  tablero:"Weather board: Ana's card has clouds, Leo's has rain, Luz sees trees in the wind",

/* If PICS is empty for a story, the page looks for images/<name>.png next to it.
   No file there = the placeholder box shows instead. */
function phHTML(id){
  return `<div class="pic ph"><div class="ph-ico">🖼️</div><div><b>Picture goes here</b></div><div class="ph-note">${PIC_NAMES[id]||''}<br>(file: images/${id}.png)</div></div>`;
}
function picHTML(id, small){
  const src = PICS[id] || `images/${id}.png`;
  const fallback = small ? "this.remove()" : `this.outerHTML=phHTML('${id}')`;
  return `<img class="${small?'pic-sm':'pic'}" src="${src}" alt="" onerror="${fallback}">`;
}

/* ---------- drawn visuals ---------- */
function clock(h, m, size){
  size = size || '1em';
  const ma = m * 6, ha = (h % 12) * 30 + m * 0.5;
  let ticks = '';
  for (let i = 1; i <= 12; i++){
    const a = i * 30 * Math.PI / 180;
    ticks += `<text x="${50 + 36*Math.sin(a)}" y="${50 - 36*Math.cos(a) + 4}" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2340">${i}</text>`;
  }
  return `<svg viewBox="0 0 100 100" style="width:${size};height:${size};vertical-align:middle">
    <circle cx="50" cy="50" r="47" fill="#fff" stroke="var(--c)" stroke-width="5"/>${ticks}
    <line x1="50" y1="50" x2="50" y2="27" stroke="#1f2340" stroke-width="5" stroke-linecap="round" transform="rotate(${ha} 50 50)"/>
    <line x1="50" y1="50" x2="50" y2="17" stroke="#e4572e" stroke-width="3" stroke-linecap="round" transform="rotate(${ma} 50 50)"/>
    <circle cx="50" cy="50" r="4" fill="#1f2340"/></svg>`;
}
function cal(month, day, wd, tag, size){
  return `<span class="cal" style="font-size:${size||'1em'}"><span class="cal-m">${month}</span><span class="cal-d">${day}</span><span class="cal-w">${wd}</span>${tag?`<span class="cal-t">${tag}</span>`:''}</span>`;
}
function sign(text, color){
  return `<span class="sign" style="background:${color}">${text}</span>`;
}
function shirt(color, size){
  return `<svg viewBox="0 0 100 100" style="width:${size||'1em'};height:${size||'1em'};vertical-align:bottom"><path d="M30 12 L12 24 L20 42 L30 36 L30 90 L70 90 L70 36 L80 42 L88 24 L70 12 Q50 26 30 12 Z" fill="${color}" stroke="#1f2340" stroke-width="3" stroke-linejoin="round"/></svg>`;
}
function coat(color, size){
  return `<svg viewBox="0 0 100 100" style="width:${size||'1em'};height:${size||'1em'};vertical-align:bottom"><path d="M34 8 L14 22 L10 80 L24 82 L28 40 L28 94 L72 94 L72 40 L76 82 L90 80 L86 22 L66 8 L50 30 Z" fill="${color}" stroke="#1f2340" stroke-width="3" stroke-linejoin="round"/><line x1="50" y1="30" x2="50" y2="94" stroke="#1f2340" stroke-width="3"/><circle cx="56" cy="50" r="3" fill="#1f2340"/><circle cx="56" cy="66" r="3" fill="#1f2340"/><circle cx="56" cy="82" r="3" fill="#1f2340"/></svg>`;
}
function table(item, pos, size){
  size = size || '1em';
  const spots = { on:'left:50%;bottom:62%;transform:translateX(-50%)', under:'left:50%;bottom:4%;transform:translateX(-50%)', beside:'right:-14%;bottom:4%' };
  return `<span class="tbl" style="width:calc(${size} * 1.6);height:${size}">
    <span class="tbl-top"></span><span class="tbl-leg l"></span><span class="tbl-leg r"></span>
    <span class="tbl-item" style="${spots[pos]}">${item}</span></span>`;
}

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const strip = h => String(h).replace(/<br\s*\/?>/gi, '. ').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g,' ').replace(/&bull;/g,',').replace(/[«»“”]/g,'').replace(/\s+/g,' ').trim();

const hasTTS = 'speechSynthesis' in window;
const canSpeak = hasTTS || Object.keys(AUDIO).length > 0;
const normKey = t => strip(t).toLowerCase().replace(/[¿?¡!.,:;«»“”"]/g,'').replace(/\s+/g,' ').trim();
let esVoice = null, curAudio = null, playId = 0;
function pickVoice(){
  if (!hasTTS) return;
  const vs = speechSynthesis.getVoices();
  esVoice = vs.find(v => /^es[-_](MX|US|419)/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
if (hasTTS){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function stopSpeech(){
  playId++;
  if (curAudio){ curAudio.pause(); curAudio = null; }
  if (hasTTS) speechSynthesis.cancel();
}
function tts(text, done){
  if (!hasTTS){ done && done(); return; }
  const u = new SpeechSynthesisUtterance(strip(text).replace(/…/g,''));
  u.lang = esVoice ? esVoice.lang : 'es-MX';
  if (esVoice) u.voice = esVoice;
  u.rate = 0.85;
  if (done) u.onend = done;
  speechSynthesis.speak(u);
}
function playOne(text, id, done){
  if (id !== playId) return;
  const n = AUDIO[normKey(text)];
  if (!n){ tts(text, done); return; }
  const a = new Audio('audio/' + CLASS_CODE + '-' + String(n).padStart(3, '0') + '.mp3');
  curAudio = a;
  let fell = false;
  const fallback = () => { if (fell || id !== playId) return; fell = true; tts(text, done); };
  a.onended = () => { if (id === playId && done) done(); };
  a.onerror = fallback;
  a.play().catch(fallback);
}
function say(text){
  stopSpeech();
  const id = playId;
  const parts = String(text).split('||').map(x => x.trim()).filter(Boolean);
  let k = 0;
  const next = () => { if (k < parts.length) playOne(parts[k++], id, next); };
  next();
}
const spk = (text, cls) => canSpeak ? `<button class="spk ${cls||''}" data-say="${encodeURIComponent(strip(text))}" title="Listen">🔊</button>` : '';
document.addEventListener('click', e => {

  if (b){ e.stopPropagation(); say(decodeURIComponent(b.dataset.say)); }

/* ---------- clean teacher directions for students ---------- */
function cleanDir(d){
  d = (d || '')
    .replace(/\s*(Pick A or B\.|Type the letter in the chat\.|Say it or type it in the chat\.|A, B, or C\?|A or B\?)/g, '')
    .replace(/^Listen to the story\.\s*Then answer\.?/, 'Answer about the story.')
    .trim();
  return d || 'Pick the answer.';
}

/* ---------- build the list of steps for one topic ---------- */
function buildSteps(i){
  const tp = TOPICS[i], st = STUDENT[i] || {};
  const steps = [{t:'title'}];
  const vocab = tp.vocab || [{head:"Palabras nuevas", sub:"New words", words:tp.words}];
  vocab.forEach(v => steps.push({t:'vocab', v}));

  // matching rounds: keep each word group together, at most 4 cards a round
  const buckets = [];
  let cur = [];
  vocab.filter(v => new Set(v.words.map(w => w[0])).size === v.words.length)   // skip pages whose pictures repeat
    .forEach(v => { cur = cur.concat(v.words); if (cur.length >= 3){ buckets.push(cur); cur = []; } });
  if (cur.length){ if (buckets.length) buckets[buckets.length - 1] = buckets[buckets.length - 1].concat(cur); else buckets.push(cur); }
  buckets.forEach(b => {
    const rounds = Math.ceil(b.length / 4), size = Math.ceil(b.length / rounds);
    for (let k = 0; k < b.length; k += size) steps.push({t:'match', pairs:b.slice(k, k + size), check:true});
  });

  tp.turns.forEach((tn, k) => {
    if (tn.tell){ steps.push({t:'story', tn}); return; }
    if ((st.skip || []).includes(k)) return;
    const ov = (st.mc || {})[k];
    let opts, right;
    if (tn.choices && !ov){ opts = tn.choices; right = tn.c; }
    else if (ov){ opts = ov.opts; right = 0; }
    else return;
    steps.push({t:'mc', check:true, dir: ov && ov.dir ? ov.dir : cleanDir(tn.dir), vis: tn.vis, pic: tn.pic, q: tn.q, opts, right, ans: tn.ans, en: tn.en});
  });

  (st.build || []).forEach(b => steps.push({t:'build', check:true, tiles:b[0].split('|'), en:b[1]}));

  // Sonidos + Hablamos (pick the reply)
  const pool = TOPICS.flatMap(t => (t.sounds || []).flatMap(x => x.talk.filter((_, n) => n % 2).map(l => l[0])));
  (tp.sounds || []).forEach(x => {
    steps.push({t:'sound', x});
    for (let n = 0; n < x.talk.length; n += 2){
      const prompt = x.talk[n], reply = x.talk[n+1];
      const wrong = shuffle(pool.filter(p => p !== reply[0])).slice(0, 2);
      steps.push({t:'mc', check:true, talk:true, dir:`${SPEAKERS[0]} says this. Pick what ${SPEAKERS[1]} answers.`, q:prompt, opts:[reply[0], ...wrong], right:0, ans:reply[0], en:reply[1]});
    }
  });
  if (DRAW[i]) steps.push({t:'draw', d:DRAW[i]});
  steps.push({t:'end'});

  // shuffle the answer order of every multiple-choice step
  steps.forEach(s => {
    if (s.t === 'mc'){
      const order = shuffle(s.opts.map((_, n) => n));
      s.opts = order.map(n => s.opts[n]);
      s.right = order.indexOf(s.right);
    }
  });
  return steps;
}

          ${tn.lines.map((l, n) => { const es = Array.isArray(l) ? l[0] : l; const en = Array.isArray(l) ? l[1] : (STORY_EN[tn.pic] || [])[n]; return `<div class="sl">${spk(es,'sm')} ${es}${en ? `<span class="sen">${en}</span>` : ''}</div>`; }).join('')}

  if (st.t === 'sound'){
    const x = st.x;
    const syll = w => w.split('-').map(p => p === p.toUpperCase() ? `<span class="stress">${p.toLowerCase()}</span>` : p).join('<span class="dash">·</span>');
    box.innerHTML = `
      <div class="dir">🔊 <b>Sonidos</b> &nbsp;•&nbsp; Listen and repeat out loud</div>
      <p class="snd-title">${x.title}</p>
      ${x.syl && x.syl.length ? `<div class="syl">${x.syl.map(y => `<span>${y}</span>`).join('')}</div>` : ''}
      <div class="bank big snd">${x.words.map(w => `<button class="word tap" data-say="${encodeURIComponent(w[0])}"><div class="w">${w[0]}</div><div class="sb">${syll(w[1])}</div></button>`).join('')}</div>
      ${x.model ? `<div class="model">${spk(x.model,'sm')} ${x.model}</div>` : ''}
      <div class="tip">💡 ${x.tip}</div>`;
    return;
  }
  if (st.t === 'draw') return renderDraw(st, box);
  if (st.t === 'end'){
    store.set(KEY + t, '1');
    box.innerHTML = `
      <p class="big-title">¡Muy bien! 🎉</p>
      <div class="vis">⭐ 🌟 ⭐</div>
      <div class="goal">You finished <b>${tp.title}</b>.</div>`;
  }
}

function renderMC(st, box){
  const q = st.talk
    ? `<div class="bub luna solo"><span class="who">${SPEAKERS[0]}</span>${spk(st.q[0],'sm')} ${st.q[0]}<span class="ten">${st.q[1]}</span></div>`
    : `<p class="q">${st.q} ${spk(st.q.replace(/<span class="blank"><\/span>/g,'…'),'sm')}</p>${(e => e ? `<div class="qen">${e}</div>` : '')(QEN[strip(st.q.replace(/<span class="blank"><\/span>/g,'___'))])}`;
  box.innerHTML = `
    <div class="dir">${st.dir}</div>
    ${st.vis ? `<div class="vis">${st.vis}</div>` : ''}
    ${st.pic ? picHTML(st.pic, true) : ''}
    ${q}
    <div class="choices">${st.opts.map((o, n) => `<button class="choice opt" data-n="${n}">${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>`;
  const showRight = (b, speak) => {
    b.classList.add('right');
    box.querySelectorAll('.opt').forEach(o => { if (o !== b) o.classList.add('dim'); });
    $('fb').className = 'fb good';
    $('fb').innerHTML = `<div class="fb-head">¡Correcto! ⭐</div><div class="es">${st.ans} ${spk(st.ans,'sm')}</div><div class="en">${st.en}</div>`;
    if (speak) say(st.ans);
    finish();
  };
  box.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    if (done.has(s)) return;
    const n = +b.dataset.n;
    if (n === st.right){
      showRight(b, true);
    } else {
      b.classList.add('wrong'); b.disabled = true;
      $('fb').className = 'fb try';
      $('fb').innerHTML = `<div class="fb-head">Inténtalo otra vez.</div><div class="en">Try again!</div>`;
    }
  });
  if (done.has(s)) showRight(box.querySelector(`.opt[data-n="${st.right}"]`), false);
}

function renderMatch(st, box){
  const pics = shuffle(st.pairs.map((p, n) => ({p, n})));
  const words = shuffle(st.pairs.map((p, n) => ({p, n})));
  box.innerHTML = `
    <div class="dir">🧩 <b>Match</b> &nbsp;•&nbsp; Tap a picture, then tap its Spanish word.</div>
    <div class="match">
      <div class="mcol">${pics.map(x => `<button class="mcard pic-side" data-n="${x.n}">${x.p[0]}</button>`).join('')}</div>
      <div class="mcol">${words.map(x => `<button class="mcard word-side" data-n="${x.n}">${x.p[1]}</button>`).join('')}</div>
    </div>
    <div class="fb" id="fb"></div>`;
  let sel = null, left = st.pairs.length;
  if (done.has(s)){ box.querySelectorAll('.mcard').forEach(c => c.classList.add('ok')); left = 0; }
  box.querySelectorAll('.mcard').forEach(c => c.onclick = () => {
    if (c.classList.contains('ok')) return;
    if (c.classList.contains('word-side')) say(c.textContent);
    if (!sel || sel.classList.contains(c.classList.contains('pic-side') ? 'pic-side' : 'word-side')){
      if (sel) sel.classList.remove('sel');
      sel = c; c.classList.add('sel'); return;
    }
    if (sel.dataset.n === c.dataset.n){
      [sel, c].forEach(x => { x.classList.remove('sel'); x.classList.add('ok'); });
      sel = null; left--;
      if (left === 0){
        $('fb').className = 'fb good';
        $('fb').innerHTML = '<div class="fb-head">¡Correcto! ⭐ All matched!</div>';
        finish();
      }
    } else {
      const a = sel; a.classList.remove('sel');
      [a, c].forEach(x => { x.classList.add('no'); setTimeout(() => x.classList.remove('no'), 600); });
      sel = null;
      $('fb').className = 'fb try';
      $('fb').innerHTML = '<div class="fb-head">Inténtalo otra vez.</div><div class="en">Try again!</div>';
    }
  });
}

function renderBuild(st, box){
  const target = st.tiles.join(' ');
  let bank = shuffle(st.tiles.map((w, n) => ({w, n})));
  if (bank.map(x => x.w).join(' ') === target && bank.length > 1) bank.reverse();
  let line = [];
  box.innerHTML = `
    <div class="dir">🧱 <b>Build the sentence</b> &nbsp;•&nbsp; Tap the words in order.</div>
    <div class="goal">${st.en}</div>
    <div class="line" id="line"></div>
    <div class="tiles" id="tiles"></div>
    <div class="row-btns"><button class="ctl back" id="clr">↺ Start over</button><button class="ctl show" id="chk">✔ Check</button></div>
    <div class="fb" id="fb"></div>`;
  const draw = () => {
    $('line').innerHTML = line.length ? line.map((x, k) => `<button class="tile in" data-k="${k}">${x.w}</button>`).join('') : '<span class="ph-line">Tap the words below…</span>';
    $('tiles').innerHTML = bank.map((x, k) => `<button class="tile" data-k="${k}">${x.w}</button>`).join('');
    $('line').querySelectorAll('.tile').forEach(b => b.onclick = () => { if (done.has(s)) return; bank.push(line.splice(+b.dataset.k, 1)[0]); draw(); });
    $('tiles').querySelectorAll('.tile').forEach(b => b.onclick = () => { if (done.has(s)) return; line.push(bank.splice(+b.dataset.k, 1)[0]); draw(); });
  };
  draw();
  if (done.has(s)){ line = st.tiles.map((w, n) => ({w, n})); bank = []; draw(); $('line').classList.add('good'); }
  $('clr').onclick = () => { if (done.has(s)) return; bank = bank.concat(line); line = []; draw(); $('fb').className = 'fb'; };
  $('chk').onclick = () => {
    if (done.has(s)) return;
    if (bank.length){ $('fb').className = 'fb try'; $('fb').innerHTML = '<div class="fb-head">Use all the words.</div>'; return; }
    if (line.map(x => x.w).join(' ') === target){
      $('line').classList.add('good');
      $('fb').className = 'fb good';
      $('fb').innerHTML = `<div class="fb-head">¡Correcto! ⭐</div><div class="es">${target} ${spk(target,'sm')}</div>`;
      say(target); finish();
    } else {
      $('fb').className = 'fb try';
      $('fb').innerHTML = '<div class="fb-head">Inténtalo otra vez.</div><div class="en">Try again! Tap a word to send it back.</div>';
    }
  };
}


/* ---------- drawing board ---------- */
const COLORS = [['#1f2340','black'],['#ef4444','red'],['#f97316','orange'],['#facc15','yellow'],['#22c55e','green'],['#3b82f6','blue'],['#a855f7','purple'],['#8b5a2b','brown']];
const DRAWINGS = {};   // kept while the page is open, so Back/Next don't lose the picture
function renderDraw(st, box){
  const d = st.d;
  const mem = DRAWINGS[t] = DRAWINGS[t] || {strokes:[], text:'', color:COLORS[0][0], erase:false};
  box.innerHTML = `
    <div class="dir">🎨 <b>Dibuja</b> &nbsp;•&nbsp; Draw and write</div>
    <div class="goal-card">${d.prompt}<div class="qen">${d.en}</div></div>
    <div class="board">
      <div class="tools">
        ${COLORS.map(c => `<button class="sw" data-c="${c[0]}" title="${c[1]}" style="background:${c[0]}"></button>`).join('')}
        <button class="tool" id="eraser">🧽 Eraser</button>
        <button class="tool" id="undo">↩️ Undo</button>
        <button class="tool" id="wipe">🗑️ Clear</button>
      </div>
      <canvas id="cv" width="1200" height="720"></canvas>
    </div>
    <div class="write">
      <label for="txt"><b>Write in Spanish:</b> <span class="qen inline">Example: ${d.starter}</span></label>
      <input id="txt" type="text" autocomplete="off" spellcheck="false" placeholder="${d.starter}">
      <div class="chips">${d.words.map(w => `<button class="chip">${w}</button>`).join('')}</div>
      <div class="tip">Tap a word to add it. You can also type.</div>
    </div>
    <div class="row-btns"><button class="ctl show" id="save">💾 Save my drawing</button></div>`;
  const cv = $('cv'), ctx = cv.getContext('2d');
  const W = cv.width, H = cv.height;
  const redraw = () => {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    mem.strokes.forEach(sk => {
      ctx.strokeStyle = sk.c; ctx.lineWidth = sk.w; ctx.beginPath();
      sk.p.forEach(([x, y], k) => k ? ctx.lineTo(x * W, y * H) : ctx.moveTo(x * W, y * H));
      if (sk.p.length === 1) ctx.lineTo(sk.p[0][0] * W + .1, sk.p[0][1] * H);
      ctx.stroke();
    });
  };
  const pick = () => {
    box.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', !mem.erase && b.dataset.c === mem.color));
    $('eraser').classList.toggle('on', mem.erase);
    cv.style.cursor = mem.erase ? 'cell' : 'crosshair';
  };
  box.querySelectorAll('.sw').forEach(b => b.onclick = () => { mem.color = b.dataset.c; mem.erase = false; pick(); });
  $('eraser').onclick = () => { mem.erase = true; pick(); };
  $('undo').onclick = () => { mem.strokes.pop(); redraw(); };
  $('wipe').onclick = () => { if (mem.strokes.length && confirm('Clear the whole drawing?')){ mem.strokes = []; redraw(); } };
  let cur = null;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); cur = {c: mem.erase ? '#fff' : mem.color, w: mem.erase ? 40 : 9, p:[pt(e)]}; mem.strokes.push(cur); redraw(); };
  cv.onpointermove = e => { if (!cur) return; cur.p.push(pt(e)); redraw(); };
  cv.onpointerup = cv.onpointercancel = () => { cur = null; };
  const txt = $('txt');
  txt.value = mem.text;
  txt.oninput = () => { mem.text = txt.value; };
  box.querySelectorAll('.chip').forEach(b => b.onclick = () => {
    say(b.textContent);
    txt.value = (txt.value.trim() + ' ' + b.textContent).trim(); mem.text = txt.value;
  });
  $('save').onclick = () => {
    const out = document.createElement('canvas'); out.width = W; out.height = H + 140;
    const o = out.getContext('2d');
    o.fillStyle = '#fff'; o.fillRect(0, 0, out.width, out.height);
    o.drawImage(cv, 0, 0);
    o.fillStyle = '#1f2340'; o.font = 'bold 48px Segoe UI, Arial, sans-serif'; o.textAlign = 'center';
    o.fillText(mem.text || '', W / 2, H + 85);
    const a = document.createElement('a');
    a.download = CLASS_CODE + '-' + TOPICS[t].en.replace(/[^A-Za-z]+/g, '-').replace(/-+$/, '') + '-drawing.png';
    a.href = out.toDataURL('image/png'); a.click();
  };
  pick(); redraw();
}

document.addEventListener('keydown', e => {
  if (t === null || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') next();
  else if (e.key === 'ArrowLeft') back();
});
buildHome();
